site_name: Alidade
site_url: https://keatonclark.github.io/alidade/
docs_dir: ./src

repo_name: KeatonClark/Alidade
repo_url: https://github.com/KeatonClark/Alidade

plugins:
  - fetch-files:
      paths: 
        - source: !ENV ALIDADE_HW
          destination: alidade-hw
        - source: !ENV KICANVAS
          destination: kicanvas
  - search

extra_javascript:
  - https://unpkg.com/tabulator-tables/dist/js/tabulator.min.js
  - https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js
  - kicanvas/kicanvas.js
  - javascripts/kicad-results.js
  - javascripts/fullscreen-container.js

theme:
  name: material
  palette:
    scheme: slate

extra:
  generator: false

extra_css:
  - https://unpkg.com/tabulator-tables/dist/css/tabulator.min.css
  - stylesheets/gruvbox.css
  - stylesheets/tabulator.css
  - stylesheets/model-viewer.css


nav:
  - Home: index.md
  - Hardware:
    - Schematic: Schematic.md
    - Layout: Layout.md
